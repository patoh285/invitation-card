<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123524">
  <title>Invitation card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ HERO (compact on inner pages) ============ -->
  <header class="hero" id="hero">
    <button class="lang" id="lg" aria-label="Switch language"></button>
    <div class="hero-inner">
      <p class="kick" data-t="kicker"></p>
      <h1 id="hn"></h1>
      <p class="host" id="hh"></p>
      <p class="whenvenue" id="hwv"></p>
      <div class="cd" id="cd" aria-hidden="true"></div>
      <div class="hero-cta" id="heroCta">
        <a class="btn primary" href="#book" data-t="bookNow"></a>
        <button class="btn ghost light" id="bshare" data-t="share"></button>
      </div>
    </div>
  </header>

  <!-- ============ DESKTOP TOP NAV ============ -->
  <nav class="topnav" id="nav">
    <a href="#home"   data-page="home"   data-t="nHome"></a>
    <a href="#book"   data-page="book"   data-t="nBook"></a>
    <a href="#ticket" data-page="ticket" data-t="nTicket"></a>
    <a href="#info"   data-page="info"   data-t="nInfo"></a>
  </nav>

  <main>

    <!-- ================= PAGE: HOME ================= -->
    <section class="page" id="p-home">

      <div class="card">
        <h2 data-t="about"></h2>
        <p class="desc" id="ab"></p>
        <ul class="meta">
          <li><span data-t="when"></span><b id="mw"></b></li>
          <li><span data-t="where"></span><b id="mv"></b></li>
        </ul>
        <div class="actions">
          <a class="btn ghost sm" id="amap" target="_blank" rel="noopener" data-t="map"></a>
          <button class="btn ghost sm" id="bcal" data-t="cal"></button>
        </div>
      </div>

      <!-- Extra text sections (Programme, Dress code, etc.) -->
      <div id="sx"></div>

      <!-- Seat availability + inline CTA -->
      <div class="card seats-card">
        <div class="between">
          <h2 data-t="seatsT" style="margin:0"></h2>
          <span class="cnt" id="cnt"></span>
        </div>
        <div class="bar"><div class="fill" id="sbar"></div></div>
        <a class="btn primary" href="#book" data-t="bookNow"></a>
      </div>

      <!-- Photo strip -->
      <div class="card" id="photoStripCard" hidden>
        <div class="between">
          <h2 data-t="gallery" style="margin:0"></h2>
          <a class="btn ghost sm" href="#photos" data-t="viewAll" id="viewAllLink"></a>
        </div>
        <div class="grid" id="gg-strip"></div>
      </div>

      <!-- FAQ preview -->
      <div class="card" id="faqPreviewCard" hidden>
        <div class="between">
          <h2 data-t="faq" style="margin:0"></h2>
          <a class="btn ghost sm" href="#info" data-t="viewAll" id="faqAllLink"></a>
        </div>
        <div id="fq-preview"></div>
      </div>

    </section>

    <!-- ================= PAGE: BOOK (3-step) ================= -->
    <section class="page" id="p-book" hidden>

      <!-- Step indicators -->
      <ol class="steps" id="steps">
        <li class="on" data-step="1"><b>1</b><span data-t="stepPeople"></span></li>
        <li data-step="2"><b>2</b><span data-t="stepDetails"></span></li>
        <li data-step="3"><b>3</b><span data-t="stepPay"></span></li>
      </ol>

      <!-- Step 1: people -->
      <div class="card step-panel" id="step-1">
        <h2 data-t="ppl"></h2>
        <div class="people-grid" id="peopleGrid"></div>
        <p class="mut" id="priceHint"></p>
        <button class="btn primary" data-next="2" data-t="next"></button>
      </div>

      <!-- Step 2: names & phones -->
      <div class="card step-panel" id="step-2" hidden>
        <h2 data-t="nmTitle"></h2>
        <div id="rows"></div>
        <div class="actions">
          <button class="btn ghost" data-back="1" data-t="back"></button>
          <button class="btn primary" data-next="3" data-t="next"></button>
        </div>
      </div>

      <!-- Step 3: payment -->
      <div class="card step-panel" id="step-3" hidden>
        <h2 data-t="payTitle"></h2>
        <p class="paybox" id="paybox"></p>
        <p class="tot" id="tot"></p>
        <label for="mp" data-t="mp"></label>
        <input id="mp" data-p="mp" autocapitalize="characters" autocomplete="off">
        <div id="msg" class="err"></div>
        <div class="actions">
          <button class="btn ghost" data-back="2" data-t="back"></button>
          <button class="btn primary" id="go" data-t="send"></button>
        </div>
      </div>

      <!-- Fully booked fallback -->
      <div class="card" id="fullnote" hidden>
        <h2 data-t="full"></h2>
      </div>

    </section>

    <!-- ================= PAGE: MY TICKET ================= -->
    <section class="page" id="p-ticket" hidden>
      <div class="card">
        <h2 data-t="chk"></h2>
        <p class="mut" data-t="chkHint"></p>
        <input id="q" data-p="mp" autocapitalize="characters" autocomplete="off">
        <button class="btn primary" id="ck" data-t="chkBtn"></button>
        <div id="res" style="margin-top:16px"></div>
      </div>
    </section>

    <!-- ================= PAGE: PHOTOS (full gallery) ================= -->
    <section class="page" id="p-photos" hidden>
      <div class="card">
        <h2 data-t="gallery"></h2>
        <div class="grid" id="gg"></div>
      </div>
    </section>

    <!-- ================= PAGE: INFO (sections + FAQ + ask) ================= -->
    <section class="page" id="p-info" hidden>
      <div id="infoSections"></div>

      <div class="card">
        <h2 data-t="faq"></h2>
        <div id="fq"></div>
      </div>

      <div class="card">
        <h2 data-t="ask"></h2>
        <p class="mut" data-t="askHint"></p>
        <label for="ak" data-t="askKind"></label>
        <select id="ak">
          <option value="question" data-t="kindQ"></option>
          <option value="feedback" data-t="kindF"></option>
        </select>
        <label for="an" data-t="yname"></label>
        <input id="an" data-p="yname" maxlength="80">
        <label for="ac" data-t="ycontact"></label>
        <input id="ac" data-p="ycontact" maxlength="80">
        <label for="at" data-t="ytext"></label>
        <textarea id="at" data-p="ytext" maxlength="1000"></textarea>
        <div id="am" class="err"></div>
        <button class="btn primary" id="as" data-t="asend"></button>
      </div>
    </section>

    <!-- ================= PAGE: ADMIN ================= -->
    <section class="page" id="p-admin" hidden>
      <div id="app"></div>
    </section>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="foot">
    <button class="linkbtn" onclick="location.hash='#admin'" data-t="footerAdmin"></button>
    <span>·</span>
    <button class="linkbtn" id="fshare" data-t="footerShare"></button>
    <span>·</span>
    <button class="linkbtn" id="flang"></button>
  </footer>

  <!-- ============ MOBILE BOTTOM TAB BAR ============ -->
  <nav class="tabbar" id="tabbar">
    <a href="#home"   data-page="home">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-t="nHome"></span>
    </a>
    <a href="#book"   data-page="book">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 2v4M16 2v4M4 10h16" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      <span data-t="nBook"></span>
    </a>
    <a href="#ticket" data-page="ticket">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span data-t="nTicket"></span>
    </a>
    <a href="#info"   data-page="info">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8h.01M11 12h1v5h1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span data-t="nInfo"></span>
    </a>
  </nav>

  <!-- ============ LIGHTBOX ============ -->
  <div id="lb" class="lb" hidden>
    <button class="btn ghost light sm lbx" id="lbx" data-t="close"></button>
    <img id="lbi" alt="">
    <p id="lbc"></p>
    <div class="actions"><button class="btn ghost light sm" id="lbp">←</button><button class="btn ghost light sm" id="lbn">→</button></div>
  </div>

     <div id="toast" aria-live="polite"></div>

  <!-- Supabase SDK from CDN (must be first) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Our backend wrapper (sets window.db, window.onSnapshot, etc.) -->
  <script src="supabase.js"></script>
  <!-- The app logic -->
  <script src="app.js"></script>
</body>
</html>
